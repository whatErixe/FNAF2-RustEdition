[package]
name = "fnaf2-rust-edition"
version = "0.1.0"
edition = "2021"
description = "A fan-made FNAF 2-inspired Android prototype built with Rust and Bevy"

[lib]
name = "fnaf2_rust_edition"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "fnaf2-rust-edition"
path = "src/main.rs"

[dependencies]
bevy = { version = "0.15", default-features = true }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"

plugins {
    id 'com.android.application'
}

android {
    namespace 'com.whaterixe.fnaf2rust'
    compileSdk 34

    defaultConfig {
        applicationId 'com.whaterixe.fnaf2rust'
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName '0.2.0'
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }
}

dependencies {
    // GameActivity is the Android activity backend enabled by Bevy 0.15 defaults.
    implementation 'androidx.games:games-activity:2.0.2'
}
